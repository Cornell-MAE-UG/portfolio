# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.


# Site Settings
title                    : Your Name
name                     : Your Name
# One line about you. It appears under your name on the home page, and it is
# what search engines and messaging apps show when someone shares your link.
description              : "Mechanical engineering student at Cornell. [What you like working on.]"

# Theme and Style
theme: jekyll-theme-minimal
color_scheme: light # light/default, dark, aqua, or desert

sass:
  style: compressed

# Outputting
permalink: /:categories/:title/

collections:
  pages:
    output: true
  projects:
    output: true
    permalink: /:collection/:path/

# Markdown
markdown: kramdown
kramdown:
  input: GFM

# Plugins (previously gems:)
plugins:
  - jekyll-feed

# Files that live in this repository but are never published to the web.
# Setting this replaces Jekyll's own default list, so the Gemfile and vendor
# entries below are the defaults kept in place, not new ones.
exclude:
  - README.md
  - assets/readme/
  - Gemfile
  - Gemfile.lock
  - vendor/

